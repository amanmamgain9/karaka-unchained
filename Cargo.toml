# One crate per seam, and one per implementation that pulls in heavy
# dependencies such as a database driver. Small implementations live in their
# seam's crate. Only the final binary depends on implementations.
[workspace]
resolver = "3"
members = ["crates/*"]

# Shared by every crate; each one opts in with `version.workspace = true` etc.
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
repository = "https://github.com/amanmamgain9/karaka-unchained"
publish = false

# Versions shared across crates; each crate picks the features it needs.
[workspace.dependencies]
tokio = "1"
futures-core = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Without default features it is only the stream helpers, with no macros.
futures-util = { version = "0.3", default-features = false }
# No default features: those add the system proxy lookup and charset
# sniffing, which an API client doesn't need. `rustls` is TLS written in
# Rust, so there's no OpenSSL to install or link. `http2` is what Anthropic's
# servers prefer. The body is read with `Response::chunk`, so the `stream`
# feature isn't needed.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2"] }
# For reading providers' error messages. No `perf` feature: it speeds up
# large searches with two more crates, and these messages are a line long.
regex = { version = "1", default-features = false, features = ["std", "unicode"] }
# Reads the HTTP date a `Retry-After` header can hold. No dependencies.
httpdate = "1"
# libzstd, for the JSONL backend's compressed session logs, as dsh writes
# them. Pinned to a release some weeks old. No default features: those add
# decoding of pre-1.0 zstd formats and the dictionary builder, which
# session logs never use.
zstd = { version = "=0.14.3", default-features = false }

# The workspace's own crates, so each one names its siblings the same way.
karaka-kernel = { path = "crates/karaka-kernel" }
karaka-model = { path = "crates/karaka-model" }
karaka-sse = { path = "crates/karaka-sse" }
karaka-session = { path = "crates/karaka-session" }
karaka-tools = { path = "crates/karaka-tools" }
karaka-agent = { path = "crates/karaka-agent" }
karaka-session-persistence = { path = "crates/karaka-session-persistence" }
karaka-system-prompt = { path = "crates/karaka-system-prompt" }
# Implementations. Only the `karaka` binary names these.
karaka-anthropic = { path = "crates/karaka-anthropic" }
karaka-openai = { path = "crates/karaka-openai" }
karaka-agent-loop = { path = "crates/karaka-agent-loop" }
karaka-retry = { path = "crates/karaka-retry" }
karaka-session-jsonl = { path = "crates/karaka-session-jsonl" }
