[package]
name = "karaka-mcp-client"
description = "An MCP client: JSON-RPC over stdio and Streamable HTTP, dsh's version negotiation, and its reconnecting connection supervisor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The wire is JSON-RPC. `preserve_order`, so messages keep the key order the
# SDK writes them in.
serde_json = { workspace = true, features = ["preserve_order"] }
# Tasks per transport and connection, process spawning, timers and channels.
tokio = { workspace = true, features = ["rt", "process", "io-util", "sync", "time", "macros"] }
# Streamable HTTP, through the HTTP client the model providers already use.
reqwest.workspace = true
# Its SSE responses, through the providers' parser.
karaka-sse.workspace = true
# A request's cancel, the signal the question and approval services take.
karaka-fs.workspace = true
# SIGTERM for a stdio server's close; already in the tree through tokio.
libc = "0.2"
# A server's tools are registered in the tool registry, under a scope for a
# preset's server, and its instructions are a prompt section.
karaka-tools.workspace = true
karaka-model.workspace = true
karaka-system-prompt.workspace = true
karaka-scope.workspace = true
# The plugin, and the preset plugin a preset mounts a server with.
karaka-kernel.workspace = true
karaka-agent-presets.workspace = true
# SHA-256 for a lossy public tool name's identity hash, as dsh's
# `createHash('sha256')`; already in the tree through rustls.
ring = "0.17"

[dev-dependencies]
karaka-fs.workspace = true
karaka-scope.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "test-util"] }
