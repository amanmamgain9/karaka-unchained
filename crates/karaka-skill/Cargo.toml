[package]
name = "karaka-skill"
description = "The skill registry: merges skill catalogs from providers and runtime registrations, and loads the winning skill for a name"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# For the plugin that provides the registry.
karaka-kernel.workspace = true
# An invocation's message source is a session `UserSource`.
karaka-session.workspace = true
# Registrations are filed under scopes, and a view reads the viewer's chain.
karaka-scope.workspace = true
# The cancel a lookup carries: a cause-less signal, as dsh's `AbortSignal`,
# the one the question and approval services use.
karaka-fs.workspace = true
# Summaries and resource bases in dsh's JSON, for the tool and clients.
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
# `macros` to race provider work against the cancel.
tokio = { workspace = true, features = ["macros"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
