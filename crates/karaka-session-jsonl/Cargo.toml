[package]
name = "karaka-session-jsonl"
description = "A session persistence backend: one JSONL file per session under a root directory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# For the plugin that provides the backend.
karaka-kernel.workspace = true
# The sessions, headers and events stored.
karaka-session.workspace = true
# The port this crate implements, and the checks every backend shares.
karaka-session-persistence.workspace = true
# Rows are JSON. `preserve_order` keeps the keys of a stored row in the
# order they were written, so a row is rewritten the same way.
serde_json = { workspace = true, features = ["preserve_order"] }
# File work runs on Tokio's blocking pool, and each handle runs its
# operations one at a time behind an async lock.
tokio = { workspace = true, features = ["rt", "sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }
