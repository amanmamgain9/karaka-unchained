[package]
name = "karaka-agent-loop"
description = "The default agent loop: a port of dsh's ReactLoopAgent, and the plugin that provides it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# For the plugin that provides the agents port.
karaka-kernel.workspace = true
# The seams the loop drives: models, tools, sessions, and the agent trait it
# implements.
karaka-model.workspace = true
karaka-tools.workspace = true
karaka-session.workspace = true
karaka-agent.workspace = true
# The scopes an agent sees prompt contributions, tools and listeners through.
karaka-scope.workspace = true
# Each step's system prompt and tool list are assembled from the registry.
karaka-system-prompt.workspace = true
# The agent's pending input is the session's `inbox` projection, folded
# from its `agent/inbox/spliced` events.
karaka-session-projection.workspace = true
# The inbox's state is checkpointed and served as JSON.
serde.workspace = true
# The compact stream records each settlement embeds are JSON.
serde_json.workspace = true
# Each agent drives its turns on a task of its own. `sync` is for the watch
# channels that carry a cancel and the idle state, and `macros` for
# `select!`, which races each model stream and tool call against a cancel.
# No `tokio-util`: dropping the raced future is the cancellation, so no
# cancellation token is needed.
tokio = { workspace = true, features = ["rt", "sync", "macros"] }

[dev-dependencies]
# `rt-multi-thread` for one test that drives an agent from many threads.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
# The scripted model's stream.
futures-core.workspace = true
