[package]
name = "karaka-model"
description = "The model seam: what a conversation is, and the port a model provider implements"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

# Kept tiny. Provider crates such as Anthropic's depend on this one and bring
# their own HTTP and JSON libraries.
[dependencies]
# For the plugin that puts the model registry in a runtime. The kernel has
# no dependencies of its own, so this adds almost nothing to the build.
karaka-kernel.workspace = true
# Only the `Stream` trait, which every async library agrees on. No executor.
futures-core.workspace = true
# Off unless a crate asks for the `serde` feature. Providers turn it on so
# their configs can name an `Effort`; the seam itself never needs it.
serde = { workspace = true, optional = true }

# Only for running the async tests.
[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
