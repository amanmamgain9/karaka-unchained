[package]
name = "karaka-working-directory"
description = "Each session's working directory: durable changes, recovery, and the runtime context that shows it to the model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# For the plugin that provides the service.
karaka-kernel.workspace = true
# Directories are resolved and checked through the mounted filesystem.
karaka-fs.workspace = true
# The change event, the session's header, and the notice's message.
karaka-session.workspace = true
# The directory is the `workingDirectory` projection.
karaka-session-projection.workspace = true
# The runtime context, and the listener that checks the directory first.
karaka-system-prompt.workspace = true
# A change's notice is injected into the agent's inbox.
karaka-agent.workspace = true
# The change event's data, and the paths quoted as JSON strings.
serde_json.workspace = true
# `sync` for each session's turn and the drain; `macros` for racing an
# operation against its cancel.
tokio = { workspace = true, features = ["sync", "macros"] }

[dev-dependencies]
karaka-scope.workspace = true
karaka-fs-local.workspace = true
karaka-agent-loop.workspace = true
karaka-model.workspace = true
karaka-tools.workspace = true
karaka-user-approval.workspace = true
futures-core.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }
