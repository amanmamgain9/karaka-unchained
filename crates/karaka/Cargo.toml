[package]
name = "karaka"
description = "The Karaka runtime binary: it chooses the plugins and starts them"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

# The only crate that depends on implementations such as the providers. Every
# other crate sees just the ports.
[dependencies]
karaka-kernel.workspace = true
karaka-model.workspace = true
karaka-anthropic.workspace = true
karaka-openai.workspace = true
# `karaka chat`: the agent loop, the seams it is driven through, and the
# sessions and tools it uses.
karaka-agent.workspace = true
karaka-agent-loop.workspace = true
karaka-session.workspace = true
karaka-tools.workspace = true
karaka-retry.workspace = true
# The system prompt the loop assembles each step from.
karaka-system-prompt.workspace = true
# The state domains project from each session's log.
karaka-session-projection.workspace = true
# The host's files, behind the filesystem seam.
karaka-fs-local.workspace = true
# Each session's working directory, shown to the model.
karaka-working-directory.workspace = true
# The model's tool for reading and changing it.
karaka-tool-working-directory.workspace = true
# The model's task list.
karaka-tool-todo.workspace = true
# Questions the model asks the user, and its tool for asking them. The
# binary answers them on the terminal.
karaka-user-questions.workspace = true
karaka-tool-ask-user.workspace = true
# Approvals, which a tool call may need, answered on the terminal too.
karaka-user-approval.workspace = true
# Skills: the registry, the provider that finds SKILL.md files on disk, and
# the model's `skill` tool with the session catalog.
karaka-skill.workspace = true
karaka-skill-filesystem.workspace = true
karaka-tool-skill.workspace = true
# Agent presets from `KARAKA_PRESETS`: the registry, and the plugins a
# preset row may name.
karaka-agent-presets.workspace = true
karaka-persona.workspace = true
karaka-tool-policy.workspace = true
# Reads the presets file. The YAML 1.2 parser skill frontmatter is read
# with, pinned to the same release.
yaml-rust2 = { version = "=0.13.0", default-features = false }
# Durable chats: the persistence seam, and its JSONL backend.
karaka-session-persistence.workspace = true
karaka-session-jsonl.workspace = true
# The arguments a tool takes.
serde_json.workspace = true
# Writes the time `current_time` answers with.
httpdate.workspace = true
# `rt-multi-thread` is the executor a server will need, so the binary starts
# on it now. `macros` is for `#[tokio::main]`.
# `sync` for handing a line of stdin to whoever asked for it.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync"] }
