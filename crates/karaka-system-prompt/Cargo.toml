[package]
name = "karaka-system-prompt"
description = "The system prompt seam: the registry of prompt sections, runtime context, tool schemas and variables, assembled before each model step"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# For the plugin that puts the registry in a runtime.
karaka-kernel.workspace = true
# Tool schemas are the model seam's type.
karaka-model.workspace = true
# A contribution's scope, and the chain an assembly sees.
karaka-scope.workspace = true

# Only for running the async tests.
[dev-dependencies]
# A session scope is named by its session's id.
karaka-session.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
