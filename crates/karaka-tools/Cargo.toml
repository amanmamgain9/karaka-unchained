[package]
name = "karaka-tools"
description = "The tools seam: the trait a tool implements, and the registry the loop runs tools through"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# For the plugin that puts the registry in a runtime.
karaka-kernel.workspace = true
# A tool's schema and the call the model made are the model seam's types,
# so a tool is described once, in the shape every provider sends.
karaka-model.workspace = true
# The registry is a tool source of the system prompt.
karaka-system-prompt.workspace = true
# The registry parses the model's arguments, and checks them against the
# tool's parameters, before a tool sees them. `preserve_order`, so the
# checks walk properties in declaration order, as dsh's validator does.
serde_json = { workspace = true, features = ["preserve_order"] }
# A call carries the agent that made it, as dsh's `ToolExecutionInput` does.
karaka-agent.workspace = true
# Tools, restrictions and gate listeners are filed under scopes, and a call
# sees them through its agent's chain.
karaka-scope.workspace = true

[dev-dependencies]
# A session scope is named by its session's id.
karaka-session.workspace = true
# Only for running the async tests.
tokio = { workspace = true, features = ["macros", "rt", "sync"] }
